services:
  app:
    build: .
    user: root
    # Install packages inside Docker on every start (fast when nothing changed), then start the dev server
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      # Project files are shared with your PC, so you edit them with your usual editor
      - .:/app
      # node_modules stays inside Docker (faster, and no OS mismatch)
      - node_modules:/app/node_modules
    
volumes:
  node_modules:
